# Managed centrally: changes made in this repository are overwritten.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # The cooldown delays version updates only. Security updates come at once.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # The cooldown delays version updates only. Security updates come at once.
    cooldown:
      default-days: 7
    ignore:
      # The types must match the oldest supported Node version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["@medusajs/*","react","react-dom","@types/react","@types/react-dom"]
        update-types: ["minor", "patch"]
      medusa:
        patterns: ["@medusajs/*","react","react-dom","@types/react","@types/react-dom"]
      security:
        applies-to: security-updates
        patterns: ["*"]
